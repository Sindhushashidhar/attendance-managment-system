<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Attendance System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C63FF;
            --primary-dark: #4B45B2;
            --accent: #FF6584;
            --green: #20c997;
            --red: #ff5c7a;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 50%, #ecfeff 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(90deg, #6C63FF, #FF6584);
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.3);
        }
        .navbar-brand, .nav-link { color: white !important; font-weight: 600; }
        .btn { border-radius: 12px; font-weight: 600; transition: all 0.2s ease; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.15); }
        .btn-primary { background: linear-gradient(90deg, #6C63FF, #8B84FF); border: none; }
        .btn-primary:hover { background: linear-gradient(90deg, #4B45B2, #6C63FF); }
        .card {
            border: none;
            border-radius: 18px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
            animation: fadeUp 0.5s ease both;
        }
        .card-header {
            border-radius: 18px 18px 0 0 !important;
            font-weight: 600;
            background: linear-gradient(90deg, #6C63FF, #8B84FF);
            color: white;
        }
        .hover-lift { transition: transform 0.25s ease, box-shadow 0.25s ease; }
        .hover-lift:hover { transform: translateY(-8px); box-shadow: 0 14px 30px rgba(0,0,0,0.18); }
        .class-card { color: white; padding: 24px; }
        .class-card h5 { font-weight: 700; }
        .grad-0 { background: linear-gradient(135deg, #6C63FF, #8B84FF); }
        .grad-1 { background: linear-gradient(135deg, #FF6584, #FF9A9E); }
        .grad-2 { background: linear-gradient(135deg, #20c997, #38e8b0); }
        .grad-3 { background: linear-gradient(135deg, #ff9f43, #ffc371); }
        .auth-wrapper { min-height: 85vh; display: flex; align-items: center; justify-content: center; }
        .form-control, .form-select { border-radius: 12px; padding: 10px 14px; }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(108, 99, 255, 0.25);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('teacher.dashboard') if current_user.is_authenticated else url_for('auth.login') }}">
                <i class="bi bi-calendar-check-fill"></i> Attendance System
            </a>
            {% if current_user.is_authenticated %}
            <div>
                <span class="text-white me-3"><i class="bi bi-person-circle"></i> {{ current_user.name }}</span>
                <a class="nav-link d-inline" href="{{ url_for('auth.logout') }}"><i class="bi bi-box-arrow-right"></i> Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
