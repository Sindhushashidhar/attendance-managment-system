<!DOCTYPE html>
<html>
<head><title>{{ class_obj.class_name }}</title></head>
<body>
    <h2>{{ class_obj.class_name }}</h2>
    <a href="{{ url_for('teacher.add_student', class_id=class_obj.id) }}">+ Add Student</a>
    <a href="{{ url_for('teacher.mark_attendance', class_id=class_obj.id) }}">Mark Attendance</a>
    <a href="{{ url_for('teacher.dashboard') }}">Back to Dashboard</a>

    <h3>Students</h3>
    <ul>
        {% for s in students %}
            <li>{{ s.roll_number }} - {{ s.student_user.name if s.student_user else 'Unknown' }}</li>
        {% else %}
            <li>No students yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
