<!DOCTYPE html>
<html>
<head><title>Add Student</title></head>
<body>
    <h2>Add Student to {{ class_obj.class_name }}</h2>
    <form method="POST">
        <input type="text" name="name" placeholder="Student Name" required><br>
        <input type="email" name="email" placeholder="Student Email" required><br>
        <input type="text" name="roll_number" placeholder="Roll Number" required><br>
        <input type="password" name="password" placeholder="Temporary Password" required><br>
        <button type="submit">Add Student</button>
    </form>
    <a href="{{ url_for('teacher.view_class', class_id=class_obj.id) }}">Back to Class</a>
</body>
</html>
