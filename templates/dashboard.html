{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold">👋 Hello, {{ current_user.name }}</h3>
    <a href="{{ url_for('teacher.create_class') }}" class="btn btn-primary"><i class="bi bi-plus-circle"></i> New Class</a>
</div>

<div class="row g-4">
    {% for c in classes %}
    <div class="col-md-4">
        <a href="{{ url_for('teacher.view_class', class_id=c.id) }}" class="text-decoration-none">
            <div class="card class-card hover-lift grad-{{ loop.index0 % 4 }}">
                <i class="bi bi-mortarboard-fill" style="font-size: 2.5rem;"></i>
                <h5 class="mt-3">{{ c.class_name }}</h5>
                <small>Click to open <i class="bi bi-arrow-right"></i></small>
            </div>
        </a>
    </div>
    {% else %}
    <div class="col-12 text-center text-muted py-5">
        <i class="bi bi-inbox" style="font-size: 3rem;"></i>
        <p class="mt-2">No classes yet. Create one to get started!</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
